 document.getElementById("royalScore").textContent=state.royal;
 document.getElementById("round").textContent="ROUND "+round;
 document.getElementById("category").textContent="CATEGORY: "+cat;
 document.getElementById("puzzleNo").textContent="PUZZLE "+num+" OF 20";

 const words=document.getElementById("words"); words.innerHTML="";
 answer.split(" ").forEach((word,wi)=>{
   const line=document.createElement("div"); line.className="wordLine";
   [...word].forEach(ch=>{
     const t=document.createElement("div"); t.className="tile"+((state.reveal||state.used.includes(ch))?" revealed":"");
     t.textContent=(state.reveal||state.used.includes(ch))?ch:"";
     line.appendChild(t);
   });
   words.appendChild(line);
 });

 const kb=document.getElementById("keyboard");kb.innerHTML="";
 "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(ch=>{
   const b=document.createElement("button");b.className="key"+(state.used.includes(ch)?" used":"");b.textContent=ch;
   if(document.body.classList.contains("host")&&!state.used.includes(ch)) b.onclick=()=>{state.used.push(ch);publish()};
   else b.disabled=true;
   kb.appendChild(b);
 });

 const sel=document.getElementById("puzzleSelect");
 if(sel){
   sel.innerHTML=puzzles.map((p,n)=>`<option value="${n}">Round ${Math.floor(n/20)+1} • Puzzle ${n%20+1} • ${p[1]}</option>`).join("");
   sel.value=state.i;
 }
 const hl=document.getElementById("hostLetters");
 if(hl)hl.textContent="USED LETTERS: "+(state.used.join(" ")||"NONE");
}
function selectPuzzle(){state.i=+document.getElementById("puzzleSelect").value;state.used=[];state.reveal=false;publish()}
function prevPuzzle(){state.i=(state.i+59)%60;state.used=[];state.reveal=false;publish()}
function nextPuzzle(){state.i=(state.i+1)%60;state.used=[];state.reveal=false;publish()}
function solve(){state.reveal=true;publish()}
function score(team,n){state[team]=Math.max(0,state[team]+n);publish()}
document.addEventListener("change",e=>{if(e.target.id==="puzzleSelect")selectPuzzle()});
render();
</script>
</body>
</html>
