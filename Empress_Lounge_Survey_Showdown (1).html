<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empress Lounge Survey Showdown</title>
<style>
:root{--gold:#f2cf72;--gold2:#b9852d;--blue:#163b63;--blue2:#285b8e;--yellow:#f5d35d;--ink:#090b10;--panel:#111721;--panel2:#182231;--white:#fffaf0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#254d74 0,#101721 34%,#07090d 78%);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body:before,body:after{content:"👑";position:fixed;font-size:100px;opacity:.08;z-index:0;pointer-events:none}body:before{left:2%;top:8%;transform:rotate(-18deg)}body:after{right:2%;bottom:8%;transform:rotate(18deg)}
.spark{position:fixed;width:4px;height:4px;background:var(--gold);border-radius:50%;opacity:.65;animation:float 5s infinite ease-in-out;z-index:0}.p1{left:12%;top:30%}.p2{left:82%;top:22%;animation-delay:1s}.p3{left:24%;top:72%;animation-delay:2s}.p4{left:73%;top:68%;animation-delay:3s}@keyframes float{50%{transform:translateY(-22px) scale(1.5);opacity:.2}}
.wrap{position:relative;z-index:1;max-width:1200px;margin:auto;padding:26px}.header{text-align:center}.crown{font-size:54px;filter:drop-shadow(0 0 10px rgba(242,207,114,.45))}.eyebrow{letter-spacing:.34em;font-weight:900;font-size:12px;color:var(--gold)}h1{font-size:clamp(34px,6vw,62px);margin:5px 0;background:linear-gradient(90deg,#fff,#f2cf72,#fff);-webkit-background-clip:text;color:transparent}.tag{font-size:14px;opacity:.7}
.board{margin-top:20px;background:linear-gradient(145deg,rgba(20,28,40,.97),rgba(8,11,17,.98));border:1px solid rgba(242,207,114,.6);border-radius:24px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
.rounds{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:15px}.round{padding:9px 14px;border:1px solid #4b5665;border-radius:999px;font-weight:900;font-size:12px}.round.active{background:linear-gradient(90deg,var(--gold2),var(--gold));color:#111;border-color:var(--gold)}
.question{font-size:clamp(22px,3.2vw,34px);font-weight:1000;text-align:center;padding:20px;border-top:1px solid #313a47;border-bottom:1px solid #313a47}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;text-align:center;padding:14px 8%}.teamname{letter-spacing:.15em;font-weight:900;font-size:12px;color:var(--gold)}.score{font-size:48px;font-weight:1000}.xs{font-size:38px;font-weight:1000;min-width:170px;color:#ffeded}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:72px;border:2px solid var(--gold2);border-radius:14px;background:linear-gradient(145deg,#0d1118,#182332);color:var(--white);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:900;cursor:pointer;transition:.2s}.answer:hover{transform:translateY(-2px);border-color:var(--gold);background:#202d3c}.answer.hidden{justify-content:center;color:var(--gold);letter-spacing:.08em}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}.controls button{min-height:46px;background:#111821;color:var(--white);border:1px solid #596574;border-radius:11px;padding:10px 16px;font-weight:900;cursor:pointer}.controls button:hover{border-color:var(--gold)}.active{background:linear-gradient(90deg,var(--gold2),var(--gold))!important;color:#111!important;border-color:var(--gold)!important}
.host{margin-top:20px;padding-top:15px;border-top:1px solid #303947}.label{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:900}.key{font-size:14px;line-height:1.8;opacity:.8}
.fast{display:none}.fast.show{display:block}.fmrow{display:grid;grid-template-columns:1fr 90px;gap:10px;margin:9px 0}.fmrow input{width:100%;background:#0b0f15;color:white;border:1px solid #596574;border-radius:9px;padding:12px;font-size:18px}.total{text-align:center;font-size:34px;font-weight:1000;color:var(--gold);margin-top:14px}
@media(max-width:700px){.wrap{padding:12px}.answers{grid-template-columns:1fr}.teams{padding:12px 2%}.score{font-size:36px}.xs{min-width:80px;font-size:28px}.answer{font-size:18px}}
</style>
</head>
<body>
<span class="spark p1"></span><span class="spark p2"></span><span class="spark p3"></span><span class="spark p4"></span>
<div class="wrap">
<header class="header"><div class="crown">👑</div><div class="eyebrow">THE EMPRESS LOUNGE PRESENTS</div><h1>SURVEY SHOWDOWN</h1><div class="tag">Where the Lounge comes to play ✨</div></header>
<section class="board">
<div class="rounds"><span class="round active" id="r1">ROUND 1 · WARM UP</span><span class="round" id="r2">ROUND 2 · DOUBLE</span><span class="round" id="r3">ROUND 3 · TRIPLE</span><span class="round" id="rf">⚡ FAST MONEY</span></div>
<div class="question" id="question"></div>
<div class="teams"><div><div class="teamname">TEAM A</div><div class="score" id="scoreA">0</div></div><div class="xs" id="xs"></div><div><div class="teamname">TEAM B</div><div class="score" id="scoreB">0</div></div></div>
<div class="answers" id="answers"></div>
<div class="controls"><button class="active team" data-team="A">TEAM A</button><button class="team" data-team="B">TEAM B</button><button id="wrong">❌ WRONG</button><button id="steal">🏆 STEAL</button><button id="next">NEXT ROUND</button><button id="fast">⚡ FAST MONEY</button><button id="reset">RESET</button></div>
<div class="host"><div class="label">PRIVATE HOST ANSWER KEY</div><div class="key" id="key"></div></div>
</section>
<section class="board fast" id="fastPanel"><header class="header"><div class="crown">👑</div><div class="eyebrow">FINAL ROUND</div><h2 style="font-size:34px;margin:6px 0">⚡ FAST MONEY</h2><div class="tag">Five questions. One shot. Let's see what the survey says.</div></header><div id="fm" style="margin-top:15px"></div><div class="controls"><button id="calc" class="active">CALCULATE TOTAL</button><button id="fmReset">RESET FAST MONEY</button></div><div class="total" id="total">TOTAL: 0</div></section>
</div>
<script>
const rounds=[
{q:"Name something people do when they're trying to get over an ex.",a:[["Block them",32],["Cry",24],["Go out with friends",17],["Date someone new",12],["Work out",8],["Delete pictures",7]]},
{q:"Name something people always forget when they leave the house.",a:[["Keys",34],["Phone",25],["Wallet",16],["Charger",10],["Sunglasses",8],["Water bottle",7]]},
{q:"Name something people do when they have a crush.",a:[["Check their social media",31],["Smile a lot",22],["Text them",18],["Act nervous",12],["Talk about them",10],["Dress up",7]]}
];
const fast=[["Name something you do before going on a date.",30],["Name a reason someone might be late.",25],["Name something people eat for breakfast.",20],["Name something you keep beside your bed.",15],["Name something people do on a Friday night.",10]];
let round=0,team="A",scoreA=0,scoreB=0,strikes=0;
const $=id=>document.getElementById(id);
function render(){const d=rounds[round];$("question").textContent=d.q;$("xs").textContent="";strikes=0;$("answers").innerHTML="";d.a.forEach((v,i)=>{let b=document.createElement("button");b.className="answer hidden";b.textContent="ANSWER "+(i+1);b.onclick=()=>reveal(b,i);$("answers").appendChild(b)});$("key").innerHTML=d.a.map((v,i)=>`${i+1}. <b>${v[0]}</b> — ${v[1]}`).join(" &nbsp; • &nbsp; ");[$("r1"),$("r2"),$("r3")].forEach((el,i)=>el.classList.toggle("active",i===round))}
function reveal(b,i){if(!b.classList.contains("hidden"))return;let v=rounds[round].a[i];b.classList.remove("hidden");b.innerHTML=`<span>${v[0]}</span><span>${v[1]*(round+1)}</span>`;if(team==="A"){scoreA+=v[1]*(round+1);$("scoreA").textContent=scoreA}else{scoreB+=v[1]*(round+1);$("scoreB").textContent=scoreB}}
document.querySelectorAll(".team").forEach(b=>b.onclick=()=>{team=b.dataset.team;document.querySelectorAll(".team").forEach(x=>x.classList.toggle("active",x===b))});
$("wrong").onclick=()=>{if(strikes<3){strikes++;$("xs").textContent="❌".repeat(strikes)}};
$("steal").onclick=()=>{team=team==="A"?"B":"A";strikes=0;$("xs").textContent="🏆 STEAL — TEAM "+team+"!";document.querySelectorAll(".team").forEach(b=>b.classList.toggle("active",b.dataset.team===team))};
$("next").onclick=()=>{round=(round+1)%rounds.length;render()};
$("reset").onclick=()=>{round=0;scoreA=0;scoreB=0;$("scoreA").textContent=0;$("scoreB").textContent=0;render()};
$("fast").onclick=()=>$("fastPanel").classList.toggle("show");
$("fm").innerHTML=fast.map((x,i)=>`<div class="fmrow"><div class="answer">${x[0]}</div><input type="number" min="0" max="100" value="0" aria-label="Points ${i+1}"></div>`).join("");
$("calc").onclick=()=>{let t=0;$("fm").querySelectorAll("input").forEach(i=>t+=Math.max(0,Math.min(100,Number(i.value)||0)));$("total").textContent="TOTAL: "+t};
$("fmReset").onclick=()=>{$("fm").querySelectorAll("input").forEach(i=>i.value=0);$("total").textContent="TOTAL: 0"};
render();
</script>
</body>
</html>
